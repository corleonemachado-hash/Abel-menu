* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #090909;
  color: white;

}

.panel {
  width: 340px;

h1 {

.subtitle {

}

}

  border: 1px solid #444;
}

button {
  background: #e52626;
  color: white;
  border: none;

  cursor: pointer;
}

button:active {
  opacity: .7;
}

#menu {
  display: none;
}

.status {
  color: #4cff8a;
  text-align: center;
  font-size: 12px;
  margin-top: 15px;
}

.option {
  background: #252525;
  border: 1px solid #444;
}

footer {
  text-align: center;
  color: #666;
  font-size: 11px;
  margin-top: 20px;
}
