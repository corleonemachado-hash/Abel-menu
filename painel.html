<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARCIA MENU</title>
<style>
body { background:#0a0a0a; color:white; font-family:Arial; margin:0; padding:20px; }
.menu { background:#111; border-radius:15px; padding:15px; max-width:400px; margin:auto; border:1px solid #333; }
.header { text-align:center; color:#00ff88; font-weight:bold; font-size:20px; margin-bottom:15px; }
.btn { width:100%; padding:12px; margin:6px 0; background:#222; border:1px solid #444; color:white; border-radius:10px; font-weight:bold; }
.btn:hover { background:#00ff88; color:black; }
.item { background:#1a1a1a; padding:10px; border-radius:10px; margin:10px 0; display:flex; justify-content:space-between; align-items:center; }
.status { color:#00ff88; font-size:12px; }
</style>
</head>
<body>
<div class="menu">
<div class="header">GARCIA MENU GRÁTIS</div>
<button class="btn">PLAYER</button>
<button class="btn">FARM MINA</button>
<button class="btn">VEÍCULOS</button>
<button class="btn">GAME</button>

<div class="item">
<div><b>Speed Hack Andando</b><br><span class="status">Risco BAIXO</span></div>
<div>1x</div>
</div>

<div class="item">
<div><b>Speed Hack Agachado</b><br><span class="status">Risco BAIXO</span></div>
<div>1x</div>
</div>

<div class="item">
<div><b>Super Pulo</b><br><span class="status">Risco BAIXO</span></div>
<div>1x</div>
</div>
</div>
</body>
</html>
