<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GARCIA MENU GRATIS</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:0}
.menu{width:100%;max-width:500px;margin:auto;background:rgba(15,15,15,0.95);border-radius:15px;display:flex;overflow:hidden;border:1px solid #333;min-height:600px}
.left{width:32%;background:rgba(0,0,0,0.8);padding:10px;display:flex;flex-direction:column;gap:8px;border-right:1px solid #222}
.right{width:68%;padding:15px}
.btn{padding:10px;background:#1c1c1c;border:1px solid #333;color:#fff;border-radius:10px;font-size:12px;font-weight:bold}
.btn.active{background:#222;color:#00ff66;border-color:#00ff66}
.header{color:#00ff66;text-align:center;font-weight:bold;padding:10px;font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;background:#1a1a1a;padding:12px;border-radius:10px;margin:10px 0}
.toggle{width:40px;height:22px;background:#333;border-radius:20px;position:relative;transition:0.3s}
.toggle.on{background:#00ff66}
.toggle::after{content:'';width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:0.3s}
.toggle.on::after{left:20px}
.ctrl{display:flex;gap:5px;align-items:center}
.ctrl button{background:#222;border:1px solid #444;color:#fff;padding:4px 8px;border-radius:6px}
.close{background:transparent;border:1px solid red;color:#fff;padding:8px;border-radius:10px;margin-top:auto}
</style>
</head>
<body>
<div class="menu">
<div class="left">
<div class="header">GARCIA MENU GRÁTIS</div>
<button class="btn active" onclick="tab('player',this)">PLAYER</button>
<button class="btn" onclick="tab('farm',this)">FARM MINA</button>
<button class="btn" onclick="tab('veiculos',this)">VEÍCULOS</button>
<button class="btn" onclick="tab('game',this)">GAME</button>
<button class="close">X CLOSE</button>
</div>
<div class="right">
<div id="player"><h3 style="color:#fff">PLAYER</h3>
<div class="item"><span>Speed Hack Andando</span><div class="ctrl"><button onclick="chg('a',-1)">-</button><span id="a">1x</span><button onclick="chg('a',1)">+</button></div></div>
<div class="item"><span>Speed Hack Agachado</span><div class="ctrl"><button onclick="chg('b',-1)">-</button><span id="b">1x</span><button onclick="chg('b',1)">+</button></div></div>
<div class="item"><span>Super Pulo</span><div class="ctrl"><button onclick="chg('c',-1)">-</button><span id="c">1x</span><button onclick="chg('c',1)">+</button></div></div>
</div>
<div id="farm" style="display:none"><h3>FARM MINA</h3>
<div class="item"><span>FARM TP</span><span style="color:#00ff66">></span></div>
<div class="item"><span>FARM MOVENDO (SAFE)</span><span style="color:#00ff66">></span></div>
<div class="item"><span>TELEPORT MINA</span><span style="color:#00ff66">></span></div>
</div>
<div id="veiculos" style="display:none"><h3>VEÍCULOS</h3>
<div class="item"><span>Speed Veículos</span><div class="ctrl"><span id="v">1x</span></div></div>
</div>
<div id="game" style="display:none"><h3>GAME</h3>
<div class="item"><span>Tela Esticada</span><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
<div class="item"><span>Wall Hack</span><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
<div class="item"><span>Light Map</span><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
<div class="item"><span>Remover Vegetação</span><div class="toggle" onclick="this.classList.toggle('on')"></div></div>
</div>
</div>
</div>
<script>
let vals={a:1,b:1,c:1};
function chg(k,d){vals[k]+=d;if(vals[k]<1)vals[k]=1;if(vals[k]>10)vals[k]=10;document.getElementById(k).innerText=vals[k]+'x'}
function tab(id,btn){
document.querySelectorAll('.right > div').forEach(e=>e.style.display='none');
document.getElementById(id).style.display='block';
document.querySelectorAll('.left .btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
}
</script>
</body>
</html>
